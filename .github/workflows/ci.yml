name: CI / Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_booking_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Stop system PostgreSQL
        run: sudo systemctl stop postgresql || true

      - name: Setup Database
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/football_booking_test_db"
        run: npx prisma db migrate

      - name: Run Tests
        env:
          NODE_ENV: "test"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/football_booking_test_db"
          JWT_SECRET: "ci-testing-jwt-secret"
        run: npm test -- --runInBand
